<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Donaciones de Sangre</title>
  <link rel="stylesheet" href="../auth/auth.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 20c0-3.333 2.667-6 6-6h4c3.333 0 6 2.667 6 6" />
      </svg>
    </div>
    <div class="auth-container">
      <h1>Iniciar sesión</h1>
      <form id="loginForm" class="auth-form">
        <div class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5zm0 2c-3.314 0-6 2.686-6 6h12c0-3.314-2.686-6-6-6z"/>
          </svg>
          <input type="text" id="dni" name="dni" placeholder="DNI o Email" required>
        </div>

        <div class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="10" width="16" height="10" rx="2" ry="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          </svg>
          <input type="password" id="password" name="password" placeholder="Contraseña" required>
        </div>

        <div class="remember-row">
          <label><input type="checkbox" disabled /> Recordarme</label>
          <a href="#" aria-disabled="true">Olvidé mi contraseña</a>
        </div>

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <p class="msg" id="message"></p>
    </div>
  </div>
  <script type="module" src="./login.js"></script>
</body>
</html>
