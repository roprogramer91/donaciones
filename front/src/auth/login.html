<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Donaciones de Sangre</title>
  <link rel="stylesheet" href="../auth/auth.css">
</head>
<body>
  <div class="auth-container">
    <h1>Donaciones de Sangre</h1>
    <form id="loginForm" class="auth-form">
      <label for="dni">DNI o Email</label>
      <input type="text" id="dni" name="dni" placeholder="Ingresa tu DNI o email" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>

      <button type="submit" class="btn-primary">Iniciar sesión</button>
    </form>

    <p class="msg" id="message"></p>
  </div>

  <script type="module" src="./login.js"></script>
</body>
</html>
