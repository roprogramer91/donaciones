<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Donante</title>
  <link rel="stylesheet" href="dashboard-donante.css">
</head>
<body>
  <div class="dashboard-wrapper">

    <!-- Loader -->
    <div id="loader">
      <div class="spinner"></div>
      <span>Cargando tu panel...</span>
    </div>

    <!-- Contenido principal, oculto hasta que JS lo muestre -->
    <div id="contenido-privado" style="display: none;">
      <!-- HEADER -->
      <header class="dashboard-header">
        <!-- Saludo dinámico -->
        <div class="user-nombre" id="bienvenida">¡Hola, Donante!</div>
        <div class="header-icons">
          <button class="icon-btn" title="Notificaciones">
            <img src="https://cdn.jsdelivr.net/gh/lucide-icons/lucide/icons/bell.svg" alt="Notificaciones" />
          </button>
          <button class="icon-btn" title="Mi perfil">
            <img src="https://cdn.jsdelivr.net/gh/lucide-icons/lucide/icons/user.svg" alt="Perfil" />
          </button>
          <button class="icon-btn" id="logoutBtn" title="Cerrar sesión">
            <img src="https://cdn.jsdelivr.net/gh/lucide-icons/lucide/icons/log-out.svg" alt="Salir" />
          </button>
        </div>
      </header>

      <!-- MAIN GRID -->
      <main class="dashboard-main">
        <!-- CAMPAÑAS -->
        <section class="dashboard-campanias">
          <h2>Campañas</h2>
          <div class="campanias-list">
            <div class="campania-card">
              <img src="https://placehold.co/64x64/EEE/AAA?text=Img" alt="Campaña 1">
              <div class="campania-info">
                <strong>Campaña 1</strong>
                <p>Descripción breve de la campaña solidaria.</p>
              </div>
            </div>
            <div class="campania-card">
              <img src="https://placehold.co/64x64/EEE/AAA?text=Img" alt="Campaña 2">
              <div class="campania-info">
                <strong>Campaña 2</strong>
                <p>Texto campaña 2, breve descripción y llamado a la acción.</p>
              </div>
            </div>
          </div>
        </section>

        <!-- ESTADÍSTICAS -->
        <aside class="dashboard-estadisticas">
          <h3>Estadísticas</h3>
          <div class="estadistica-card">
            <canvas id="chart-tiposangre" width="140" height="140"></canvas>
          </div>
          <div class="estadistica-card">
            <canvas id="chart-campanias" width="140" height="80"></canvas>
          </div>
          <ul class="stats-resumen">
            <li><span>Donaciones totales:</span> <b id="donaciones-totales">4</b></li>
            <li><span>Última donación:</span> <b id="ultima-donacion">05/04/2024</b></li>
            <li><span>Días apto para donar:</span> <b id="dias-apto">35</b></li>
          </ul>
        </aside>
      </main>
    </div>

  </div>

  <script type="module" src="dashboard-donante.js"></script>
</body>
</html>
