<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro como Donante</title>
  <link rel="stylesheet" href="alta-donante.css">
</head>
<body>
  <main class="alta-donante-container">
    <h1>Completá tus datos para ser Donante</h1>
    <form id="altaDonanteForm" autocomplete="off">
      <!-- Grupo sanguíneo -->
      <label for="grupo_sanguineo">Grupo sanguíneo:</label>
      <select name="grupo_sanguineo" id="grupo_sanguineo" required>
        <option value="">Seleccioná...</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
      </select>

      <!-- Fecha de nacimiento -->
      <label for="fecha_nacimiento">Fecha de nacimiento:</label>
      <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>

      <!-- Sexo -->
      <label for="sexo">Sexo:</label>
      <select id="sexo" name="sexo" required>
        <option value="">Seleccioná...</option>
        <option value="M">Masculino</option>
        <option value="F">Femenino</option>
      </select>


      <!-- Provincia -->
      <label for="provincia_id">Provincia:</label>
      <select name="provincia_id" id="provincia_id" required>
        <option value="">Seleccioná...</option>
      </select>

      <!-- Localidad -->
      <label for="localidad_id">Localidad:</label>
      <select name="localidad_id" id="localidad_id" required>
        <option value="">Seleccioná...</option>
      </select>

      <!-- ¿Cuándo fue tu última donación? -->
      <label for="fecha_ultima_donacion">¿Cuándo fue tu última donación?</label>
      <div class="donacion-flex-row">
        <input type="date" id="fecha_ultima_donacion" name="fecha_ultima_donacion">
        <label class="label-nunca-done">
          <input type="checkbox" id="nunca_done" name="nunca_done"> Nunca doné
        </label>
      </div>
      <small class="nota-donacion">Si nunca donaste, tildá la casilla.</small>

      <!-- Preferencias de notificación -->
      <label for="preferencias_notif">¿Querés recibir avisos de campañas o emergencias?</label>
      <select name="preferencias_notif" id="preferencias_notif">
        <option value="todas">Sí, todas</option>
        <option value="solo_campañas">Solo campañas</option>
        <option value="ninguna">No, ninguna</option>
      </select>

      <button type="submit">Finalizar Registro</button>
    </form>
    <div id="mensajeExito"></div>
  </main>
  <script type="module" src="alta-donante.js"></script>
</body>
</html>
