<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Usuario – Donantes</title>
  <link rel="stylesheet" href="registro.css" />
</head>
<body>
  <main class="registro-container">
    <h1>Crear cuenta</h1>

    <form id="registroForm" autocomplete="off">
      <!-- Nombre -->
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required />

      <!-- Apellido -->
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido" required />

      <!-- Email -->
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />

            <!-- telefono -->
      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono" required />

      <!-- DNI -->
      <label for="dni">DNI:</label>
      <input type="text" id="dni" name="dni" pattern="\d{7,9}" maxlength="9" required />

      <!-- Contraseña -->
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" required minlength="6" />

      <!-- Confirmar -->
      <label for="password2">Confirmar contraseña:</label>
      <input type="password" id="password2" name="password2" required minlength="6" />

      <button type="submit">Crear cuenta</button>
    </form>

    <div id="mensaje"></div>
  </main>

  <script type="module" src="registro.js"></script>
</body>
</html>
