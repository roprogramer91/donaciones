<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Centro de Hemoterapia</title>
  <link rel="stylesheet" href="login-centro.css">
</head>
<body>
  <div class="login-centro-container">
    
    <!-- Botón de volver al inicio -->
    <button id="btn-atras" class="btn-atras" title="Volver al inicio">
      ← Volver
    </button>
    
    <h1>Ingreso para Centro de Hemoterapia</h1>
    
    <form id="loginCentroForm" autocomplete="off">
      <label for="email">Email institucional</label>
      <input type="email" id="email" name="email" required placeholder="ejemplo@hospital.com">
      
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required placeholder="Tu contraseña">

      <button type="submit">Ingresar</button>
    </form>

    <div id="login-error" class="error"></div>
  </div>

  <!-- Conexión con el JS -->
  <script type="module" src="login-centro.js"></script>
</body>
</html>
